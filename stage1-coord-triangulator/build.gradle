plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'com.seedcrack.stage1.Stage1CoordTriangulator'
}

tasks.named('run') {
    workingDir = rootProject.projectDir
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}
