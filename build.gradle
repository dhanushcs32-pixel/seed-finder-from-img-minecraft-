plugins {
    id 'base'
}

allprojects {
    group = 'com.seedcrack'
    version = '1.0.0'

    repositories {
        mavenCentral()
        maven { url 'https://maven.seedfinding.com' }
        maven { url 'https://jitpack.io' }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'application'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}
